spring:
  application:
    name: HrsBlog
  datasource:
    url: ${SPRING_DATASOURCE_URL:?SPRING_DATASOURCE_URL is required}
    username: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME is required}
    password: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
  jpa:
    hibernate:
      ddl-auto: validate
    # 生产默认关闭；排查 SQL 时改为 true，或在容器 environment 中临时覆盖 SPRING_JPA_SHOW_SQL=true
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        # 配合分页列表，把标签的懒加载收敛成少量批量查询，避免 N+1
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    baseline-on-migrate: false
  servlet:
    multipart:
      # 与 hrsblog.storage.max-size 保持一致，超出时由容器提前拒绝
      max-file-size: 5MB
      max-request-size: 6MB
server:
  port: ${SERVER_PORT:27000}
  error:
    include-message: never
    include-stacktrace: never
  forward-headers-strategy: native

hrsblog:
  jwt:
    # 必须由环境变量注入；缺失或过短时应用启动失败（不在仓库内硬编码任何密钥）
    secret: ${JWT_SECRET:hrsblog123123123123123123123123123123123123123123123213123}
    issuer: ${JWT_ISSUER:hrsblog}
    ttl: ${JWT_TTL:2h}
  storage:
    # 本地存储根目录，应用启动时自动创建；对外通过 /assets/** 暴露
    # 默认值为当前用户主目录下的 hrsblog-assets，容器里由 compose 覆盖为 /app/storage/assets
    local-dir: ${STORAGE_LOCAL_DIR:${user.home}/hrsblog-assets}
    # 写入数据库的对外链接前缀，需与 nginx / Spring 静态映射保持一致
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:}
    max-size: 5MB
    allowed-types: jpg,jpeg,png,webp,gif
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:27080,http://localhost:27081}
  transport:
    proxy-protocol-version: ${PROXY_PROTOCOL_VERSION:}
  deploy:
    # 部署通知（「内容变更 → Webhook → CI 重建」）的运行期参数。
    # 事件类型 / 防抖窗口 / 重试次数可在后台「站点设置 → 集成」里覆盖，这里是兜底值。
    default-event-type: blog-content-updated
    default-debounce-seconds: 10
    default-max-retries: 2
    # 逐次退避（秒）：第 1 次失败后等 5 秒，第 2 次等 15 秒，以此类推。
    backoff-seconds: [5, 15, 30, 60]
    connect-timeout-seconds: 5
    read-timeout-seconds: 10
  friend-link:
    # 同一个 IP 每天最多可提交的友链申请次数；0 表示不限制。
    daily-submit-limit: 5
    # 是否信任反向代理写入的 X-Forwarded-For / X-Real-IP 头。
    # 后端端口未对公网暴露时保持 true（否则所有访客共用 nginx 地址，限频形同虚设）；
    # 若后端端口可能被直连，请设为 false，以免伪造转发头绕过限频。
    trust-forwarded-headers: true
  guest-message:
    # 同一个 IP 每天最多可提交的留言次数；0 表示不限制。
    daily-submit-limit: 5
    # 是否信任反向代理写入的 X-Forwarded-For / X-Real-IP 头（语义与 friend-link 一致）。
    trust-forwarded-headers: true
  admin:
    # 可选：首次启动时按环境变量创建管理员（表内已存在管理员时不做任何事）
    bootstrap-username: user
    bootstrap-password: admin123
    bootstrap-display-name: hrs

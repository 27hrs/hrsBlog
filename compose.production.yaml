name: hrsblog

services:
  # 博客前端不在这里跑：静态产物由 CI 的 publish-content job 用 rsync 同步到
  # /opt/hrsBlog/www，由宿主机上的 nginx 直接提供，不再需要 nginx 容器。

  admin-frontend:
    image: ghcr.io/27hrs/hrsblog-admin-frontend:${IMAGE_TAG:-latest}
    ports:
      - "27081:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  backend:
    image: ghcr.io/27hrs/hrsblog-backend:${IMAGE_TAG:-latest}
    ports:
      - "27000:27000"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?SPRING_DATASOURCE_URL is required}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME is required}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      # 必填：JWT 签名密钥，至少 32 个字符；轮换方式见 docs/deployment.md
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_TTL: ${JWT_TTL:-2h}
      # 静态资源链接前缀，对公网域名时填 https://<域名>（由 nginx 或 Spring 提供 /assets/**）
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}
      STORAGE_LOCAL_DIR: /app/storage/assets
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      PROXY_PROTOCOL_VERSION: ${PROXY_PROTOCOL_VERSION:-}
    volumes:
      # 命名卷首次创建会继承镜像内 /app/storage 的属主（app 用户），无需手工 chown
      - hrsblog-storage:/app/storage
    restart: unless-stopped

volumes:
  hrsblog-storage:

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 6m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Runtime API requests stay same-origin and avoid browser CORS entirely.
    location /api/ {
        proxy_pass http://backend:27000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded covers live at /assets/image/**; hashed SPA files live at /assets/*.
    location /assets/image/ {
        proxy_pass http://backend:27000;
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vue Router history fallback for the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 6m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml application/rss+xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Uploaded covers are copied into the image at build time. If one was added
    # after the last build, fall back to the backend instead of returning 404.
    location /assets/image/ {
        try_files $uri @backend;
        expires 1h;
    }

    # VitePress hashed assets.
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Reserved for runtime visitor requests; the generated site itself is static.
    location /api/ {
        proxy_pass http://backend:27000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /feed.xml {
        types {
            application/rss+xml xml;
        }
        default_type application/rss+xml;
        expires 1h;
    }

    # clean URLs redirect internally to *.html; keep HTML revalidated.
    location ~* \.html$ {
        expires -1;
    }

    # /articles/foo -> /articles/foo.html; real 404 for everything else.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location @backend {
        proxy_pass http://backend:27000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 1h;
    }
}

name: Publish content

on:
  push:
    branches: [master]
  # 后端发布文章/改站点设置后，由后端调用 GitHub API 触发（POST /repos/{owner}/{repo}/dispatches）。
  # 事件名需与后端 hrsblog.deploy.event-type 一致。
  repository_dispatch:
    types: [blog-content-updated]
  workflow_dispatch:

permissions:
  contents: read

# 独立的并发组：与 deploy.yml 的镜像构建互不排队。
# cancel-in-progress: true —— 新 run 必然包含更新的内容，
# 且 rsync 带 --delay-updates，中断旧 run 不会留下半成品站点。
concurrency:
  group: hrsblog-publish-content
  cancel-in-progress: true

jobs:
  # 内容发布：在 CI 里构建静态站点，用 rsync 增量同步到服务器。
  # 不产生镜像、不重启容器；产物直接写进 1Panel 的站点根目录，由它的 nginx 提供。
  publish-content:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 环境级 Secrets/Variables 只有 job 声明 environment 时才可见。
    # 环境名默认 production；若你的环境叫别的名字，加一个仓库变量 DEPLOY_ENV 覆盖即可。
    environment: ${{ vars.DEPLOY_ENV || 'production' }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build static site
        env:
          BLOG_API_BASE: ${{ vars.BLOG_API_BASE }}
          BLOG_SITE_URL: ${{ vars.BLOG_SITE_URL }}
          BLOG_SYNC_STRICT: ${{ vars.BLOG_SYNC_STRICT || '1' }}
        run: |
          set -euo pipefail
          if [ -z "${BLOG_API_BASE//[[:space:]]/}" ]; then
            echo "::error::缺少 BLOG_API_BASE；继续构建只会产出 fixtures，已中止。"
            exit 1
          fi
          # 与 Dockerfile 相同的工具链，避免 runner 上的 Node 版本漂移
          docker run --rm \
            -v "$PWD/blog_frontend:/app" -w /app \
            -e BLOG_API_BASE -e BLOG_SITE_URL -e BLOG_SYNC_STRICT \
            node:22-alpine \
            sh -c 'corepack enable && corepack prepare pnpm@10.34.1 --activate \
                   && pnpm install --frozen-lockfile && pnpm build'

      - name: Validate SSH secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          missing=0
          for name in SSH_HOST SSH_PORT SSH_USER SSH_KEY SSH_HOST_FINGERPRINT; do
            if [ -z "${!name//[[:space:]]/}" ]; then
              echo "::error::缺少 $name —— 请到 Settings → Secrets and variables → Actions → Secrets 添加"
              missing=1
            fi
          done
          [ "$missing" = 0 ] || exit 1
          echo "SSH secrets 已配置：$SSH_USER@$SSH_HOST:$SSH_PORT"

      - name: Prepare SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          port="${SSH_PORT:-22}"
          # 主机不可达时不让 set -e 直接退出，交给下面的指纹校验给出明确提示
          ssh-keyscan -p "$port" -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null || true
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::无法从 $SSH_HOST:$port 获取主机密钥，请检查 SSH_HOST / SSH_PORT 和防火墙。"
            exit 1
          fi
          expected="${SSH_HOST_FINGERPRINT#SHA256:}"
          if [ -z "$expected" ] || \
             ! ssh-keygen -lf ~/.ssh/known_hosts | grep -qF "SHA256:$expected"; then
            echo "::error::SSH 主机指纹与 SSH_HOST_FINGERPRINT 不一致，已中止。"
            exit 1
          fi

      - name: Rsync content to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          # 站点根目录（1Panel 的站点目录）。换路径时改仓库变量 DEPLOY_PATH 即可，不用改代码。
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/1panel/www/sites/27hrsblog/index' }}
        run: |
          set -euo pipefail
          port="${SSH_PORT:-22}"
          # 不用 -a：hrs 不是 root，-a 会试图改属主而报错
          rsync -rlptz --no-owner --no-group --delete --delay-updates \
            --chmod=D755,F644 --itemize-changes \
            -e "ssh -p $port -i ~/.ssh/deploy_key \
                -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            blog_frontend/.vitepress/dist/ \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
          echo "已同步 $(find blog_frontend/.vitepress/dist -type f | wc -l) 个文件到 $DEPLOY_PATH"

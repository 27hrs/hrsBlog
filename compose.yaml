services:
  blog-frontend:
    # image:
    build:
      context: ./blog_frontend
    ports:
      - "27080:8080"

  admin-frontend:
    # image:
    build:
      context: ./admin_frontend
    ports:
      - "27081:8080"

  backend:
    # image:
    build:
      context: ./backend
    ports:
      - "27000:27000"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-}
      # 必填：至少 32 个字符，缺失时容器启动即失败（不在仓库内保留默认密钥）
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_TTL: ${JWT_TTL:-2h}
      STORAGE_LOCAL_DIR: /app/storage/assets
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:27080,http://localhost:27081}
    volumes:
      - hrsblog-storage:/app/storage

volumes:
  hrsblog-storage:

name: hrsblog
